# EKF para Go2: fusiona /odom_rf2o (RF2O+odom_filter) + /imu (desde /lowstate)
# Salida: TF odom->base_footprint (nivel suelo), /odometry/filtered
# Static base_footprint->base_link (0,0,0.28) en el launch
# AMCL usa el TF del EKF para localizacion
# Orden config: x,y,z, roll,pitch,yaw, vx,vy,vz, vroll,vpitch,vyaw, ax,ay,az
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    base_link_frame: base_footprint
    odom_frame: odom
    map_frame: map
    world_frame: odom

    odom0: /odom_rf2o
    odom0_config: [true, true, false, false, false, true,
                   true, true, false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    publish_tf: true
    publish_acceleration: false
